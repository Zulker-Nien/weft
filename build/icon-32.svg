<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Weft icon redrawn on the 32px pixel grid (icon_32x32, icon_16x16@2x): 4px threads, 1px cuts. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="3" x2="0" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28324d"/>
      <stop offset="1" stop-color="#151a29"/>
    </linearGradient>
    <mask id="under-clay" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <rect x="0" y="13" width="32" height="6" fill="#000"/>
    </mask>
    <mask id="under-slate" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <rect x="0" y="6" width="32" height="6" fill="#000"/>
      <rect x="0" y="20" width="32" height="6" fill="#000"/>
    </mask>
    <mask id="under-outer" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <rect x="6" y="0" width="6" height="32" fill="#000"/>
      <rect x="20" y="0" width="6" height="32" fill="#000"/>
    </mask>
    <mask id="under-middle" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <rect x="13" y="0" width="6" height="32" fill="#000"/>
    </mask>
  </defs>
  <rect x="3" y="3" width="26" height="26" rx="6" fill="url(#bg)"/>
  <g fill="#ece5d8">
    <rect x="7" y="5" width="4" height="22" rx="1" mask="url(#under-clay)"/>
    <rect x="14" y="5" width="4" height="22" rx="1" mask="url(#under-slate)"/>
    <rect x="21" y="5" width="4" height="22" rx="1" mask="url(#under-clay)"/>
  </g>
  <rect x="5" y="7" width="22" height="4" rx="1" fill="#6a779b" mask="url(#under-outer)"/>
  <rect x="5" y="14" width="22" height="4" rx="1" fill="#da7a4c" mask="url(#under-middle)"/>
  <rect x="5" y="21" width="22" height="4" rx="1" fill="#5f6b8f" mask="url(#under-outer)"/>
</svg>
