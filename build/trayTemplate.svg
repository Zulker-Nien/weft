<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    Menu-bar glyph (electron/assets/trayTemplate.png). Three warps and one weft that goes over,
    under, over. Pure black on transparent: macOS tints "Template" images for light and dark menu bars.
  -->
  <g fill="#000" shape-rendering="crispEdges">
    <rect x="2" y="2" width="2" height="4"/>
    <rect x="2" y="10" width="2" height="4"/>
    <rect x="7" y="2" width="2" height="12"/>
    <rect x="12" y="2" width="2" height="4"/>
    <rect x="12" y="10" width="2" height="4"/>
    <rect x="1" y="7" width="5" height="2"/>
    <rect x="10" y="7" width="5" height="2"/>
  </g>
</svg>
