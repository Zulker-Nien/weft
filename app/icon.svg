<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Weft favicon. Drawn on a 32-unit grid with even coordinates, so it stays crisp at 16px and 32px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28324d"/>
      <stop offset="1" stop-color="#151a29"/>
    </linearGradient>
    <mask id="under-clay" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <rect x="0" y="12" width="32" height="8" fill="#000"/>
    </mask>
    <mask id="under-slate" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <rect x="0" y="4" width="32" height="8" fill="#000"/><rect x="0" y="20" width="32" height="8" fill="#000"/>
    </mask>
    <mask id="under-outer" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <rect x="4" y="0" width="8" height="32" fill="#000"/><rect x="20" y="0" width="8" height="32" fill="#000"/>
    </mask>
    <mask id="under-middle" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <rect x="12" y="0" width="8" height="32" fill="#000"/>
    </mask>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <g fill="#ece5d8">
    <rect x="6" y="2" width="4" height="28" rx="1" mask="url(#under-clay)"/>
    <rect x="14" y="2" width="4" height="28" rx="1" mask="url(#under-slate)"/>
    <rect x="22" y="2" width="4" height="28" rx="1" mask="url(#under-clay)"/>
  </g>
  <rect x="2" y="6" width="28" height="4" rx="1" fill="#6a779b" mask="url(#under-outer)"/>
  <rect x="2" y="14" width="28" height="4" rx="1" fill="#da7a4c" mask="url(#under-middle)"/>
  <rect x="2" y="22" width="28" height="4" rx="1" fill="#5f6b8f" mask="url(#under-outer)"/>
</svg>
