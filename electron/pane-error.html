<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Didn't load</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1f23; --dim: #6b7280; --card: #fff; --line: #e3e3df; --accent: #e8542f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171c; --fg: #e6e6e6; --dim: #8a93a3; --card: #1e222a; --line: #2c323d; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, system-ui, sans-serif; display: grid; place-items: center; }
  main { max-width: 460px; padding: 28px 32px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 14px; color: var(--dim); }
  code { display: block; font: 12px ui-monospace, Menlo, monospace; color: var(--dim); word-break: break-all; margin-bottom: 18px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  a.btn { text-decoration: none; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); color: var(--fg); font-weight: 500; }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .wait { font-size: 12px; color: var(--dim); display: none; align-items: center; gap: 6px; margin-top: 14px; }
  .wait.on { display: flex; }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: p 1.2s ease-in-out infinite; }
  @keyframes p { 50% { opacity: .25; } }
</style>
</head>
<body>
<main>
  <h1 id="title">This page didn't load</h1>
  <p id="hint"></p>
  <code id="url"></code>
  <div class="row">
    <a class="btn primary" id="retry">Try again</a>
    <a class="btn" id="back" hidden>Back to the last page</a>
  </div>
  <div class="wait" id="wait"><span class="pulse"></span>Waiting for it to start…</div>
</main>
<script>
  // Filled from the query string by electron/pane-error.cjs; text only, never markup.
  const q = new URLSearchParams(location.search);
  const url = q.get("url") || "";
  const safe = (u) => /^(https?|file):/i.test(u || "");
  document.getElementById("title").textContent = q.get("title") || "This page didn't load";
  document.getElementById("hint").textContent = q.get("hint") || q.get("reason") || "";
  document.getElementById("url").textContent = url;
  const retry = document.getElementById("retry");
  if (safe(url)) retry.href = url;
  else retry.hidden = true;
  const back = q.get("back");
  if (safe(back)) {
    const link = document.getElementById("back");
    link.href = back;
    link.hidden = false;
  }
  // A local dev server: check every 2s and go back to it as soon as it answers.
  if (q.get("wait") === "1" && safe(url)) {
    document.getElementById("wait").classList.add("on");
    const poll = () =>
      fetch(url, { mode: "no-cors", cache: "no-store" }).then(
        () => location.replace(url),
        () => setTimeout(poll, 2000),
      );
    setTimeout(poll, 2000);
  }
</script>
</body>
</html>
