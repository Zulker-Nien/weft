<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The About window (about.cjs). Inline styles, one local script, no network: it has to open
         even when the board's server is down. Everything it shows is written with textContent. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; script-src 'self'" />
    <title>About Weft</title>
    <style>
      :root {
        --bg: #f4f3ef;
        --ink: #1c1b18;
        --muted: #64625c;
        --line: rgb(20 20 15 / 0.12);
        --accent: #d9774b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131312;
          --ink: #ecebe6;
          --muted: #a3a19a;
          --line: rgb(255 255 245 / 0.12);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--ink); }
      body {
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      main { padding: 28px 28px 20px; }
      header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 22px; }
      header img { width: 72px; height: 72px; margin-bottom: 10px; }
      h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
      .version { color: var(--muted); margin: 2px 0 0; }
      .tagline { color: var(--muted); margin: 8px 0 0; }
      dl { margin: 0; }
      .row { display: grid; grid-template-columns: 80px 1fr; gap: 12px; padding: 5px 0; border-top: 1px solid var(--line); }
      dt { color: var(--muted); }
      dd { margin: 0; min-width: 0; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; cursor: text; }
      .link { font: inherit; background: none; border: 0; padding: 0; margin-left: 8px; color: var(--accent); cursor: pointer; }
      footer { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
      footer button {
        font: inherit; font-weight: 600; cursor: pointer; border: 1px solid var(--line); border-radius: 6px;
        padding: 6px 12px; background: transparent; color: var(--ink);
      }
      footer button:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      footer button[disabled] { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="assets/icon.png" alt="" />
        <h1>Weft</h1>
        <p class="version" id="version">Loading…</p>
        <p class="tagline" id="tagline"></p>
      </header>
      <dl id="details"></dl>
      <footer>
        <button id="copy" type="button" disabled>Copy details</button>
        <button id="logs" type="button">Show logs</button>
      </footer>
    </main>
    <script src="about.js"></script>
  </body>
</html>
