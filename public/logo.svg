<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- Weft mark for the app header. Drawn on a 36-unit grid with even coordinates, so it stays crisp at 18px and 36px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28324d"/>
      <stop offset="1" stop-color="#151a29"/>
    </linearGradient>
    <mask id="under-clay" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <rect width="36" height="36" fill="#fff"/>
      <rect x="0" y="14" width="36" height="8" fill="#000"/>
    </mask>
    <mask id="under-slate" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <rect width="36" height="36" fill="#fff"/>
      <rect x="0" y="6" width="36" height="8" fill="#000"/><rect x="0" y="22" width="36" height="8" fill="#000"/>
    </mask>
    <mask id="under-outer" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <rect width="36" height="36" fill="#fff"/>
      <rect x="6" y="0" width="8" height="36" fill="#000"/><rect x="22" y="0" width="8" height="36" fill="#000"/>
    </mask>
    <mask id="under-middle" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <rect width="36" height="36" fill="#fff"/>
      <rect x="14" y="0" width="8" height="36" fill="#000"/>
    </mask>
  </defs>
  <rect width="36" height="36" rx="8" fill="url(#bg)"/>
  <g fill="#ece5d8">
    <rect x="8" y="4" width="4" height="28" rx="1" mask="url(#under-clay)"/>
    <rect x="16" y="4" width="4" height="28" rx="1" mask="url(#under-slate)"/>
    <rect x="24" y="4" width="4" height="28" rx="1" mask="url(#under-clay)"/>
  </g>
  <rect x="4" y="8" width="28" height="4" rx="1" fill="#6a779b" mask="url(#under-outer)"/>
  <rect x="4" y="16" width="28" height="4" rx="1" fill="#da7a4c" mask="url(#under-middle)"/>
  <rect x="4" y="24" width="28" height="4" rx="1" fill="#5f6b8f" mask="url(#under-outer)"/>
</svg>
